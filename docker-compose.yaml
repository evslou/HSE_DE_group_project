version: '3.9'

x-airflow-common:
  &airflow-common
  build: ./airflow
  env_file: .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER}:${POSTGRES_AIRFLOW_PASSWORD}@postgres-airflow-gp:5432/${POSTGRES_AIRFLOW_DB}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
  depends_on:
      - postgres-airflow

services:

  postgres-main:
    image: postgres:15
    container_name: postgres-main-gp
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB_MAIN}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_main_data:/var/lib/postgresql/data
      - ./postgres/init_main_db.sql:/docker-entrypoint-initdb.d/init_main_db.sql
    ports:
      - "5433:5432"

  postgres-airflow:
    image: postgres:15
    container_name: postgres-airflow-gp
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_AIRFLOW_DB}
      POSTGRES_USER: ${POSTGRES_AIRFLOW_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD}
    volumes:
      - pg_airflow_data:/var/lib/postgresql/data
      - ./postgres/init_airflow_db.sql:/docker-entrypoint-initdb.d/init_airflow_db.sql
    ports:
      - "5434:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-gp
    env_file: .env
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    ports:
      - "5050:80"
    depends_on:
      - postgres-main
      - postgres-airflow

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_DEFAULT_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_DEFAULT_PASSWORD}
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_DEFAULT_EMAIL}
      _AIRFLOW_WWW_USER_FIRSTNAME: ${AIRFLOW_DEFAULT_FIRSTNAME}
      _AIRFLOW_WWW_USER_LASTNAME: ${AIRFLOW_DEFAULT_LASTNAME}
      _AIRFLOW_WWW_USER_ROLE: Admin

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    environment:
      <<: *airflow-common-env
      AIRFLOW_CONN_POSTGRES_MAIN_GP: postgres-main://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-main-gp:5432/${POSTGRES_DB_MAIN}
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
        restart: true

volumes:
  pg_main_data:
  pg_airflow_data: